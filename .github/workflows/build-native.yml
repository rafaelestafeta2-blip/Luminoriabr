name: Build Native Apps (Android APK & Windows EXE)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. BUILD ANDROID APK
  # =========================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App (Vite)
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor Android
        run: |
          npx @capacitor/cli sync android

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Locate & Rename Android APK
        run: |
          mkdir -p build-artifacts
          find android/ -name "*.apk" -exec cp {} build-artifacts/LuminoriaPro-v1.0.0-Android.apk \; || true
          if [ ! -f "build-artifacts/LuminoriaPro-v1.0.0-Android.apk" ]; then
            find . -name "*.apk" -exec cp {} build-artifacts/LuminoriaPro-v1.0.0-Android.apk \; || true
          fi
          ls -la build-artifacts/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminoriaPro-Android-APK
          path: build-artifacts/*.apk
          retention-days: 14

  # =========================================================================
  # 2. BUILD WINDOWS EXECUTABLE (.EXE)
  # =========================================================================
  build-windows:
    name: Build Windows EXE (Installer & Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App (Vite)
        run: npm run build

      - name: Install Electron & Electron Builder
        run: npm install electron@^29.0.0 electron-builder@^24.13.3 --save-dev --legacy-peer-deps

      - name: Build Windows Executables (.exe)
        run: npx electron-builder --win --x64 --config electron-builder.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LuminoriaPro-Windows-EXE
          path: |
            dist-electron/*.exe
          retention-days: 14

  # =========================================================================
  # 3. AUTOMATIC GITHUB RELEASE (ON VERSION TAGS)
  # =========================================================================
  release:
    name: Create GitHub Release
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: LuminoriaPro-Android-APK
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: LuminoriaPro-Windows-EXE
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: Luminoria Pro ${{ github.ref_name }}
          body: |
            ## Luminoria Pro 4K - Versão Oficial
            - **Android APK:** Instale no celular ou TV Box Android
            - **Windows EXE:** Instalador NSIS e versão portátil para Windows 10/11
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
