name: Build Native Apps (Android APK & Windows EXE)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. BUILD WEB APP ASSETS (Vite on Ubuntu - Fast & Universal)
  # =========================================================================
  build-web:
    name: Build Web App (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Compile Web Bundle
        run: npm run build

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist/
          retention-days: 1

  # =========================================================================
  # 2. BUILD ANDROID APK (Uses Node 22 + Gradle + Built-in Android SDK)
  # =========================================================================
  build-android:
    name: Build Android APK
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor CLI & Dependencies
        run: npm install --legacy-peer-deps

      - name: Download Web Dist
        uses: actions/download-artifact@v4
        with:
          name: dist-web
          path: dist

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Setup Android SDK Environment & Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          for d in "$ANDROID_HOME"/cmdline-tools/*/bin "$ANDROID_HOME"/tools/bin; do
            if [ -x "$d/sdkmanager" ]; then
              echo "$d" >> $GITHUB_PATH
              export PATH="$d:$PATH"
              break
            fi
          done
          if command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
            sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          fi

      - name: Sync Capacitor Android
        run: |
          npx @capacitor/cli sync android

      - name: Build Android Debug APK
        working-directory: ./android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate & Rename Android APK
        run: |
          mkdir -p build-artifacts
          find android/ -name "*.apk" -exec cp {} build-artifacts/LuminoriaPro-v1.0.0-Android.apk \; || true
          if [ ! -f "build-artifacts/LuminoriaPro-v1.0.0-Android.apk" ]; then
            find . -name "*.apk" -exec cp {} build-artifacts/LuminoriaPro-v1.0.0-Android.apk \; || true
          fi
          ls -la build-artifacts/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminoriaPro-Android-APK
          path: build-artifacts/*.apk
          retention-days: 14

  # =========================================================================
  # 3. BUILD WINDOWS EXECUTABLE (.EXE) (Uses Node 22 + Electron Builder)
  # =========================================================================
  build-windows:
    name: Build Windows EXE (Installer & Portable)
    needs: build-web
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Web Dist
        uses: actions/download-artifact@v4
        with:
          name: dist-web
          path: dist

      - name: Install Electron & Electron Builder
        run: npm install electron@^29.0.0 electron-builder@^24.13.3 --save-dev --legacy-peer-deps

      - name: Build Windows Executables (.exe)
        run: npx electron-builder --win --x64 --config electron-builder.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LuminoriaPro-Windows-EXE
          path: |
            dist-electron/*.exe
          retention-days: 14

  # =========================================================================
  # 4. AUTOMATIC GITHUB RELEASE (ON VERSION TAGS)
  # =========================================================================
  release:
    name: Create GitHub Release
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: LuminoriaPro-Android-APK
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: LuminoriaPro-Windows-EXE
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: Luminoria Pro ${{ github.ref_name }}
          body: |
            ## Luminoria Pro 4K - Versão Oficial
            - **Android APK:** Instale no celular ou TV Box / Smart TV Android
            - **Windows EXE:** Instalador NSIS e versão portátil para Windows 10/11
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
